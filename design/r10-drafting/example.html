<!doctype html>
<html data-theme="screen">
<head><meta charset="utf-8"><title>R10 Drafting example</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components/bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="components/bundle.js"></script>
<style>body{margin:0;background:var(--ground)}</style></head>
<body><div id="root"></div>
<script>
  var R = window.R10, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(R.Workspace, {
    width: 800, height: 480,
    status: { layer: '0', modes: ['Snap'], coords: '0.0000,0.0000' },
    screenMenu: { items: ['SETUP','','BLOCKS','DIM:','DISPLAY','DRAW','EDIT','INQUIRY','LAYER:','SETTINGS','PLOT','UTILITY','','3D','','SAVE:'] },
    command: { history: ['', 'Command: LINE'], prompt: 'From point: ' },
    viewport: { grid: true, crosshair: { x: 300, y: 200 } }
  }, h(R.Circle, { cx: 300, cy: 200, r: 80, aci: 7 }), h(R.Line, { x1: 180, y1: 200, x2: 420, y2: 200, aci: 3, linetype: 'center' })));
</script>
</body></html>
